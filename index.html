<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unscramble It!</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;background:linear-gradient(135deg,#fff1f2,#eef2ff);color:#172033}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px #0001;margin:18px 0}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer;background:#4f46e5;color:#fff}.btn.alt{background:#e5e7eb;color:#111827}.input,.textarea{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:14px;margin:8px 0 14px;font-size:16px}.textarea{min-height:150px}.hidden{display:none}.scramble{text-align:center;font-size:clamp(30px,7vw,54px);font-weight:900;letter-spacing:6px;margin:28px 0}.hint{text-align:center;font-size:18px}.code{font-size:38px;font-weight:900;letter-spacing:7px;text-align:center}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#eef2ff;font-weight:800}.ok{color:#15803d;font-weight:800}.bad{color:#b91c1c;font-weight:800}.score{font-size:28px;font-weight:900}.board li{padding:8px}.muted{color:#64748b}.confirm{text-align:center;padding:10px 0}.confirm-icon{font-size:48px;margin-bottom:8px}
</style></head><body><div class="wrap"><h1>🧩 Unscramble It!</h1><p>Multiplayer meeting icebreaker</p><div id="home" class="card"><div class="row"><button class="btn" onclick="showHost()">🎤 Host a Game</button><button class="btn alt" onclick="showJoin()">👥 Join a Game</button></div></div><div id="app" class="card hidden"></div></div>
<script>
const SUPABASE_URL='https://yndwherreppivfoaztyw.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_dE2W1YoTYFs7cr3aPUP_7A__8j1qNoO';
let db,room,me,isHost=false,questions=[],channel,timer;
const WORDS=[['CUSTOMER','Someone who buys a product or service'],['TEAMWORK','People cooperating toward a shared goal'],['COMMUNICATION','Sharing information clearly'],['ESCALATION','Moving an issue to a higher level for help'],['FEEDBACK','Comments that help improve something'],['CAMPAIGN','A planned series of marketing activities'],['SENTIMENT','The feeling or attitude expressed in a comment'],['RESOLUTION','The solution to a problem'],['VACATION','Time away from work'],['CHOCOLATE','A sweet treat made from cocoa'],['KARAOKE','Singing along to recorded music'],['SUNSHINE','Light from the sun'],['BIRTHDAY','A yearly celebration of when someone was born'],['WEEKEND','Saturday and Sunday'],['ADVENTURE','An exciting or unusual experience']];
const $=id=>document.getElementById(id);function init(){if(SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_')){alert('Supabase key is not configured yet.');return false}db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);return true}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}function shuffle(s){let a=[...s];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.join('')}
function showHost(){ $('app').classList.remove('hidden');$('app').innerHTML='<div class="confirm"><div class="confirm-icon">🎤</div><h2>Host a Game?</h2><p>This option is for the person running the game.</p><p class="muted">Players should select <b>Join a Game</b>. Your question list will only appear after you confirm that you are the host.</p><div class="row"><button class="btn alt" onclick="goHome()">← Go Back</button><button class="btn" onclick="confirmHost()">I\'m the Host</button></div></div>'}
function confirmHost(){ $('app').innerHTML='<h2>🎤 Host a Game</h2><input id="hostName" class="input" placeholder="Your name"><p class="muted">You can use the default words or replace them with your own.</p><textarea id="words" class="textarea">'+WORDS.map(x=>x[0]+' | '+x[1]).join('\n')+'</textarea><button class="btn" onclick="createGame()">Create Game</button>'}
function goHome(){$('app').classList.add('hidden');$('app').innerHTML=''}
function showJoin(){$('app').classList.remove('hidden');$('app').innerHTML='<h2>👥 Join a Game</h2><input id="gameCode" class="input" maxlength="6" placeholder="Game code"><input id="playerName" class="input" placeholder="Your name"><button class="btn" onclick="joinGame()">Join Game</button>'}
async function createGame(){if(!init())return;isHost=true;let name=$('hostName').value.trim()||'Host',c=code();let {data:r,error}=await db.from('game_rooms').insert({code:c,host_name:name}).select().single();if(error)return alert(error.message);room=r;let qs=$('words').value.split('\n').filter(Boolean).map((line,i)=>{let a=line.split('|');return{room_id:r.id,position:i,word:a[0].trim().toUpperCase(),hint:(a[1]||'Unscramble this word').trim(),points:1}});let {error:e}=await db.from('questions').insert(qs);if(e)return alert(e.message);await load();subscribe();renderHostLobby()}
async function joinGame(){if(!init())return;let c=$('gameCode').value.trim().toUpperCase(),name=$('playerName').value.trim();if(!c||!name)return alert('Enter the game code and your name.');let {data:r,error}=await db.from('game_rooms').select('*').eq('code',c).single();if(error)return alert('Game not found.');if(r.status!=='lobby')return alert('This game has already started.');let {data:p,error:e}=await db.from('players').insert({room_id:r.id,name}).select().single();if(e)return alert(e.message);room=r;me=p;await load();subscribe();renderPlayerWaiting()}
async function load(){let q=await db.from('questions').select('*').eq('room_id',room.id).order('position');questions=q.data||[]}
function subscribe(){channel=db.channel('room-'+room.id).on('postgres_changes',{event:'*',schema:'public',table:'game_rooms',filter:'id=eq.'+room.id},async payload=>{room=payload.new;await load();if(room.status==='playing'){isHost?renderHostRound():renderPlayerRound()}else if(room.status==='finished'){renderFinal()}}).on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'room_id=eq.'+room.id},async()=>{if(isHost)renderHostPlayers()}).on('postgres_changes',{event:'*',schema:'public',table:'answers',filter:'room_id=eq.'+room.id},async()=>{if(isHost)renderHostPlayers()}).subscribe()}
async function startGame(){await db.from('game_rooms').update({status:'playing',current_question:0}).eq('id',room.id)}async function nextQuestion(){if(room.current_question+1>=questions.length){return endGame()}await db.from('game_rooms').update({current_question:room.current_question+1}).eq('id',room.id)}async function endGame(){await db.from('game_rooms').update({status:'finished'}).eq('id',room.id)}
async function renderHostLobby(){ $('app').innerHTML='<h2>🎮 Game Lobby</h2><p>Share this code with everyone:</p><div class="code">'+room.code+'</div><p class="muted">Players can join from the same website using this code.</p><div id="players"></div><button class="btn" onclick="startGame()">Start Game</button>';renderHostPlayers()}
async function renderHostPlayers(){let {data:p}=await db.from('players').select('*').eq('room_id',room.id).order('score',{ascending:false});$('players').innerHTML='<h3>Players ('+(p?.length||0)+'/15)</h3><ol class="board">'+(p||[]).map(x=>'<li>'+esc(x.name)+' — '+x.score+' point'+(x.score===1?'':'s')+'</li>').join('')+'</ol>'}
function renderHostRound(){let q=questions[room.current_question];$('app').innerHTML='<h2>🎤 Host — Round '+(room.current_question+1)+'</h2><div class="scramble">'+shuffle(q.word)+'</div><div class="hint">💡 '+esc(q.hint)+'</div><p class="muted">Answer: '+esc(q.word)+' • '+(room.current_question+1)+' of '+questions.length+'</p><div class="row"><button class="btn" onclick="nextQuestion()">Next Question</button><button class="btn alt" onclick="endGame()">End Game</button></div><div id="players"></div>';renderHostPlayers()}
function renderPlayerWaiting(){$('app').innerHTML='<h2>⏳ Waiting for the host</h2><p>Your name: <b>'+esc(me.name)+'</b></p><p>Game code: <span class="pill">'+room.code+'</span></p><p class="muted">The round will appear here when the host starts.</p><p>Your score: <span id="score" class="score">'+me.score+'</span></p>'}
async function renderPlayerRound(){let q=questions[room.current_question];if(!q)return;let {data:a}=await db.from('answers').select('*').eq('question_id',q.id).eq('player_id',me.id).limit(1);let answered=a?.length>0;$('app').innerHTML='<h2>🧩 Round '+(room.current_question+1)+'</h2><div class="scramble">'+shuffle(q.word)+'</div><div class="hint">💡 '+esc(q.hint)+'</div><input id="answer" class="input" placeholder="Type your answer" '+(answered?'disabled':'')+'><button class="btn" onclick="submitAnswer(\''+q.id+'\',\''+q.word+'\')" '+(answered?'disabled':'')+'>Submit Answer</button><div id="feedback">'+(answered?'<p class="muted">Answer submitted. Wait for the next round.</p>':'')+'</div><p>Your score: <span id="score" class="score">'+me.score+'</span></p>'}
async function submitAnswer(qid,correct){let val=$('answer').value.trim().toUpperCase();if(!val)return;let {data:existing}=await db.from('answers').select('id').eq('question_id',qid).eq('player_id',me.id).limit(1);if(existing?.length)return;let isCorrect=val===correct;let {error}=await db.from('answers').insert({room_id:room.id,player_id:me.id,question_id:qid,answer:val,correct:isCorrect});if(error)return alert(error.message);if(isCorrect){let {data:p}=await db.from('players').select('score').eq('id',me.id).single();await db.from('players').update({score:(p.score||0)+1}).eq('id',me.id);$('feedback').innerHTML='<p class="ok">🎉 Correct! +1 point</p>'}else $('feedback').innerHTML='<p class="bad">Not quite — your answer was recorded.</p>';$('answer').disabled=true}
async function renderFinal(){let {data:p}=await db.from('players').select('*').eq('room_id',room.id).order('score',{ascending:false});$('app').innerHTML='<h2>🏆 Final Leaderboard</h2><ol class="board">'+(p||[]).map((x,i)=>'<li><b>'+esc(x.name)+'</b> — '+x.score+' point'+(x.score===1?'':'s')+'</li>').join('')+'</ol><button class="btn" onclick="location.reload()">Play Again</button>'}
</script></body></html>
