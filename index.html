<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unscramble It!</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;background:linear-gradient(135deg,#fff1f2,#eef2ff);color:#172033}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px #0001;margin:18px 0}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer;background:#4f46e5;color:#fff}.btn.alt{background:#e5e7eb;color:#111827}.btn:disabled{opacity:.55;cursor:not-allowed}.input{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:14px;margin:8px 0 14px;font-size:16px}.hidden{display:none}.scramble{text-align:center;font-size:clamp(30px,7vw,54px);font-weight:900;letter-spacing:6px;margin:28px 0}.hint{text-align:center;font-size:18px}.code{font-size:38px;font-weight:900;letter-spacing:7px;text-align:center}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#eef2ff;font-weight:800}.ok{color:#15803d;font-weight:800}.bad{color:#b91c1c;font-weight:800}.score{font-size:28px;font-weight:900}.board li{padding:8px}.muted{color:#64748b}.confirm{text-align:center;padding:10px 0}.confirm-icon{font-size:48px;margin-bottom:8px}.host-note{text-align:center;padding:12px;border-radius:14px;background:#f8fafc;color:#64748b;margin:18px 0}.winner{text-align:center;padding:16px;border-radius:16px;background:#ecfdf5;color:#166534;margin:18px 0;font-size:18px;font-weight:800}.answer-reveal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9999;animation:fadeIn .2s ease}.answer-card{background:#fff;border-radius:28px;padding:38px 48px;text-align:center;box-shadow:0 20px 70px #0005;animation:pop .35s cubic-bezier(.2,1.4,.4,1);max-width:90vw}.answer-card .trophy{font-size:64px}.answer-card .correct-label{font-size:20px;font-weight:800;color:#15803d}.answer-card .correct-word{font-size:clamp(42px,10vw,80px);font-weight:1000;letter-spacing:3px;margin:8px 0 16px;color:#15803d}.answer-card .winner-name{font-size:22px;font-weight:800;color:#172033}@keyframes pop{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.timer{text-align:center;font-size:28px;font-weight:900;margin:12px 0}.waiting{text-align:center;padding:20px}.small{font-size:14px}
</style></head><body><div class="wrap"><h1>🧩 Unscramble It!</h1><p>Multiplayer meeting icebreaker</p><div id="home" class="card"><div class="row"><button class="btn" onclick="showHost()">🎤 Host a Game</button><button class="btn alt" onclick="showJoin()">👥 Join a Game</button></div></div><div id="app" class="card hidden"></div></div>
<script src="questions.js"></script>
<script>
const SUPABASE_URL='https://yndwherreppivfoaztyw.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_dE2W1YoTYFs7cr3aPUP_7A__8j1qNoO';
let db,room,me,isHost=false,questions=[],channel,timer,localQuestionId=null,advanceInProgress=false;
const $=id=>document.getElementById(id);
function init(){if(!db){if(SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_')){alert('Supabase key is not configured yet.');return false}db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY)}return true}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function shuffle(s){let a=[...s];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.join('')}
function showHost(){ $('app').classList.remove('hidden');$('app').innerHTML='<div class="confirm"><div class="confirm-icon">🎤</div><h2>Host a Game?</h2><p>This option is for the person running the game.</p><p class="muted">Players should select <b>Join a Game</b>.</p><div class="row"><button class="btn alt" onclick="goHome()">← Go Back</button><button class="btn" onclick="confirmHost()">I\'m the Host</button></div></div>'}
function confirmHost(){ $('app').innerHTML='<h2>🎤 Host a Game</h2><input id="hostName" class="input" placeholder="Your name"><div class="host-note">🔒 Question list and answers are hidden. The game will select the questions automatically.</div><button class="btn" onclick="createGame()">Create Game</button>'}
function goHome(){if(timer)clearInterval(timer);$('app').classList.add('hidden');$('app').innerHTML=''}
function showJoin(){$('app').classList.remove('hidden');$('app').innerHTML='<h2>👥 Join a Game</h2><input id="gameCode" class="input" maxlength="6" placeholder="Game code"><input id="playerName" class="input" placeholder="Your name"><button class="btn" onclick="joinGame()">Join Game</button>'}
async function createGame(){if(!init())return;isHost=true;let name=$('hostName').value.trim()||'Host',c=code();let {data:r,error}=await db.from('game_rooms').insert({code:c,host_name:name}).select().single();if(error)return alert(error.message);room=r;let qs=WORDS.map((x,i)=>({room_id:r.id,position:i,word:x[0],hint:x[1],points:1}));let {error:e}=await db.from('questions').insert(qs);if(e)return alert(e.message);await load();subscribe();renderHostLobby()}
async function joinGame(){if(!init())return;let c=$('gameCode').value.trim().toUpperCase(),name=$('playerName').value.trim();if(!c||!name)return alert('Enter the game code and your name.');let {data:r,error}=await db.from('game_rooms').select('*').eq('code',c).single();if(error)return alert('Game not found.');if(r.status!=='lobby')return alert('This game has already started.');let {count}=await db.from('players').select('*',{count:'exact',head:true}).eq('room_id',r.id);if((count||0)>=15)return alert('This game is full (15 players maximum).');let {data:p,error:e}=await db.from('players').insert({room_id:r.id,name}).select().single();if(e)return alert(e.message);room=r;me=p;await load();subscribe();renderPlayerWaiting()}
async function load(){let q=await db.from('questions').select('*').eq('room_id',room.id).order('position');questions=q.data||[]}
function subscribe(){channel=db.channel('room-'+room.id).on('postgres_changes',{event:'*',schema:'public',table:'game_rooms',filter:'id=eq.'+room.id},async payload=>{room=payload.new;await load();if(room.status==='playing'){isHost?renderHostRound():renderPlayerRound()}else if(room.status==='finished'){renderFinal()}}).on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'room_id=eq.'+room.id},async()=>{if(isHost)renderHostPlayers();else if(me){let {data:p}=await db.from('players').select('*').eq('id',me.id).single();if(p)me=p;let s=$('score');if(s)s.textContent=me.score}}).on('postgres_changes',{event:'*',schema:'public',table:'answers',filter:'room_id=eq.'+room.id},async payload=>{if(payload.new?.correct){if(isHost)showHostWinner(payload.new);else showPlayerWinner(payload.new)}}).subscribe()}
async function startGame(){if(!questions.length)return alert('No questions are available.');await db.from('game_rooms').update({status:'playing',current_question:0}).eq('id',room.id)}
async function advanceAutomatically(){if(advanceInProgress)return;advanceInProgress=true;if(timer)clearInterval(timer);setTimeout(async()=>{if(room.current_question+1>=questions.length){await endGame()}else{await db.from('game_rooms').update({current_question:room.current_question+1}).eq('id',room.id)}advanceInProgress=false},1400)}
async function endGame(){if(timer)clearInterval(timer);await db.from('game_rooms').update({status:'finished'}).eq('id',room.id)}
async function renderHostLobby(){ $('app').innerHTML='<h2>🎮 Game Lobby</h2><p>Share this code with everyone:</p><div class="code">'+room.code+'</div><p class="muted">Players can join from the same website using this code.</p><div id="players"></div><button class="btn" onclick="startGame()">Start Game</button>';renderHostPlayers()}
async function renderHostPlayers(){let {data:p}=await db.from('players').select('*').eq('room_id',room.id).order('score',{ascending:false});let el=$('players');if(el)el.innerHTML='<h3>Players ('+(p?.length||0)+'/15)</h3><ol class="board">'+(p||[]).map(x=>'<li>'+esc(x.name)+' — '+x.score+' point'+(x.score===1?'':'s')+'</li>').join('')+'</ol>'}
function startTimer(qid){if(timer)clearInterval(timer);let seconds=30;let el=$('timer');if(!el)return;el.textContent=seconds;timer=setInterval(()=>{seconds--;if(el)el.textContent=Math.max(seconds,0);if(seconds<=0){clearInterval(timer);timer=null;if(isHost)timeoutRound(qid)}},1000)}
async function timeoutRound(qid){let {data:a}=await db.from('answers').select('id').eq('question_id',qid).eq('correct',true).limit(1);if(a?.length)return;let box=$('winner');if(box)box.innerHTML='⏰ Time\'s up! <span class="small">The next question is loading…</span>';setTimeout(async()=>{if(room.current_question+1>=questions.length)await endGame();else await db.from('game_rooms').update({current_question:room.current_question+1}).eq('id',room.id)},1000)}
function renderHostRound(){let q=questions[room.current_question];if(!q)return;localQuestionId=q.id;$('app').innerHTML='<h2>🎤 Host — Round '+(room.current_question+1)+'</h2><div class="scramble">'+shuffle(q.word)+'</div><div class="hint">💡 '+esc(q.hint)+'</div><div class="timer">⏱️ <span id="timer">30</span></div><div id="winner" class="host-note">🔒 Answer hidden — be ready to see who gets it first!</div><p class="muted">Question '+(room.current_question+1)+' of '+questions.length+'</p><div id="players"></div>';renderHostPlayers();startTimer(q.id)}
function showAnswerReveal(playerName,word){let old=$('answerReveal');if(old)old.remove();let div=document.createElement('div');div.id='answerReveal';div.className='answer-reveal';div.innerHTML='<div class="answer-card"><div class="trophy">🏆</div><div class="correct-label">CORRECT ANSWER!</div><div class="correct-word">'+esc(word)+'</div><div class="winner-name">🎉 '+esc(playerName)+' got it first!</div></div>';document.body.appendChild(div);setTimeout(()=>div.remove(),2500)}\nasync function showPlayerWinner(answer){if(answer.question_id!==localQuestionId)return;let {data:p}=await db.from('players').select('name').eq('id',answer.player_id).single();let q=questions[room.current_question];let f=$('feedback');if(f)f.innerHTML='🏆 <b>'+esc(p?.name||'A player')+' got it first!</b><br><span>Correct answer: <b>'+esc(q.word)+'</b> 🎉</span><br><span class="muted small">Next question loading…</span>'}\nasync function showHostWinner(answer){if(answer.question_id!==localQuestionId)return;let {data:p}=await db.from('players').select('name,score').eq('id',answer.player_id).single();let q=questions[room.current_question];let box=$('winner');if(box)box.innerHTML='🏆 <b>'+esc(p?.name||'A player')+' got it first!</b><br><span>Answer: '+esc(q.word)+' • +1 point</span><br><span class="small">Next question loading…</span>';showAnswerReveal(p?.name||'A player',q.word);await advanceAutomatically()}
function renderPlayerWaiting(){$('app').innerHTML='<div class="waiting"><h2>⏳ Waiting for the host</h2><p>Your name: <b>'+esc(me.name)+'</b></p><p>Game code: <span class="pill">'+room.code+'</span></p><p class="muted">The round will appear here when the host starts.</p><p>Your score: <span id="score" class="score">'+me.score+'</span></p></div>'}
async function renderPlayerRound(){let q=questions[room.current_question];if(!q)return;localQuestionId=q.id;let {data:a}=await db.from('answers').select('*').eq('question_id',q.id).eq('player_id',me.id).limit(1);let answered=a?.length>0;$('app').innerHTML='<h2>🧩 Round '+(room.current_question+1)+'</h2><div class="scramble">'+shuffle(q.word)+'</div><div class="hint">💡 '+esc(q.hint)+'</div><div class="timer">⏱️ <span id="timer">30</span></div><input id="answer" class="input" placeholder="Type your answer" '+(answered?'disabled':'')+'><button id="submitBtn" class="btn" onclick="submitAnswer(\''+q.id+'\',\''+q.word+'\')" '+(answered?'disabled':'')+'>Submit Answer</button><div id="feedback">'+(answered?'<p class="muted">Answer submitted. Waiting for the next round.</p>':'')+'</div><p>Your score: <span id="score" class="score">'+me.score+'</span></p>';startTimer(q.id)}
async function submitAnswer(qid,correct){let input=$('answer'),btn=$('submitBtn');if(!input||!btn||input.disabled)return;let val=input.value.trim().toUpperCase();if(!val)return;input.disabled=true;btn.disabled=true;let {data:existing}=await db.from('answers').select('id').eq('question_id',qid).eq('player_id',me.id).limit(1);if(existing?.length)return;let isCorrect=val===correct;let {error}=await db.from('answers').insert({room_id:room.id,player_id:me.id,question_id:qid,answer:val,correct:isCorrect});if(error){input.disabled=false;btn.disabled=false;if(error.code==='23505'){let f=$('feedback');if(f)f.innerHTML='<p class="bad">⚡ Someone already got this round first!</p>'}else alert(error.message);return}if(isCorrect){let {data:p}=await db.from('players').select('score').eq('id',me.id).single();let {error:scoreError}=await db.from('players').update({score:(p.score||0)+1}).eq('id',me.id);if(scoreError)return alert(scoreError.message);me.score=(p.score||0)+1;let f=$('feedback');if(f)f.innerHTML='<p class="ok">🎉 YOU GOT IT FIRST! +1 POINT</p><p class="muted">Next question loading…</p>';await advanceAutomatically()}else{let f=$('feedback');if(f)f.innerHTML='<p class="bad">Not quite — someone else may still get it first!</p>'}}
async function renderFinal(){if(timer)clearInterval(timer);let {data:p}=await db.from('players').select('*').eq('room_id',room.id).order('score',{ascending:false});$('app').innerHTML='<h2>🏆 Final Leaderboard</h2><ol class="board">'+(p||[]).map(x=>'<li><b>'+esc(x.name)+'</b> — '+x.score+' point'+(x.score===1?'':'s')+'</li>').join('')+'</ol><button class="btn" onclick="location.reload()">Play Again</button>'}
</script></body></html>
