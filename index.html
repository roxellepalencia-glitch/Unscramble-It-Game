<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unscramble It!</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;background:linear-gradient(135deg,#fff1f2,#eef2ff);color:#172033}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px #0001;margin:18px 0}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer;background:#4f46e5;color:#fff}.btn.alt{background:#e5e7eb;color:#111827}.input{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:14px;margin:8px 0 14px;font-size:16px}.hidden{display:none}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#eef2ff;font-weight:800}.code{font-size:38px;font-weight:900;letter-spacing:7px;text-align:center}.muted{color:#64748b}.confirm{text-align:center;padding:10px 0}.confirm-icon{font-size:48px;margin-bottom:8px}.host-note{text-align:center;padding:12px;border-radius:14px;background:#f8fafc;color:#64748b;margin:18px 0}.score{font-size:28px;font-weight:900}.board li{padding:8px}.scramble{text-align:center;font-size:clamp(30px,7vw,54px);font-weight:900;letter-spacing:6px;margin:28px 0}.hint{text-align:center;font-size:18px}.timer{text-align:center;font-size:28px;font-weight:900;margin:12px 0}.waiting{text-align:center;padding:20px}.small{font-size:14px}.ok{color:#15803d;font-weight:800}.bad{color:#b91c1c;font-weight:800}.winner{text-align:center;padding:16px;border-radius:16px;background:#ecfdf5;color:#166534;margin:18px 0;font-size:18px;font-weight:800}.answer-reveal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9999}.answer-card{background:#fff;border-radius:28px;padding:38px 48px;text-align:center;box-shadow:0 20px 70px #0005}.answer-card .trophy{font-size:64px}.answer-card .correct-label{font-size:20px;font-weight:800;color:#15803d}.answer-card .correct-word{font-size:clamp(42px,10vw,80px);font-weight:1000;color:#15803d}.answer-card .winner-name{font-size:22px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
<h1>🧩 Unscramble It!</h1>
<p>Multiplayer meeting icebreaker</p>
<div id="home" class="card">
<div class="row">
<button id="hostBtn" type="button" class="btn">🎤 Host a Game</button>
<button id="joinBtn" type="button" class="btn alt">👥 Join a Game</button>
</div>
</div>
<div id="app" class="card hidden"></div>
</div>

<script src="questions.js"></script>
<script>
const SUPABASE_URL='https://yndwherreppivfoaztyw.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InluZHdoZXJyZXBwaXZmb2F6dHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NzU0NzAsImV4cCI6MjEwNTE1MTQ3MH0.EOhwuFbds89kcVElwUI9SAKn-XJfclChBr6_RoJ3SQk';
let db,room,me,isHost=false,questions=[],channel,timer,localQuestionId=null,advanceInProgress=false,pausedBeforeNext=false;
const $=id=>document.getElementById(id);

function init(){
  if(!db){
    if(typeof supabase==='undefined'){alert('The game connection library did not load. Please refresh the page.');return false}
    db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY)
  }
  return true
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function shuffle(s){let a=[...s];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.join('')}
function normalizeAnswer(s){return String(s||'').trim().replace(/\s+/g,' ').toUpperCase()}

function showHost(){
 $('app').classList.remove('hidden');
 $('app').innerHTML='<div class="confirm"><div class="confirm-icon">🎤</div><h2>Host a Game?</h2><p>This option is for the person running the game.</p><p class="muted">Players should select <b>Join a Game</b>.</p><div class="row"><button id="backBtn" type="button" class="btn alt">← Go Back</button><button id="confirmHostBtn" type="button" class="btn">I\'m the Host</button></div></div>';
 $('backBtn').addEventListener('click',goHome);
 $('confirmHostBtn').addEventListener('click',confirmHost);
}
function confirmHost(){
 $('app').innerHTML='<h2>🎤 Host a Game</h2><input id="hostName" class="input" placeholder="Your name"><div class="host-note">🔒 Question list and answers are hidden. The game will select the questions automatically.</div><button id="createBtn" type="button" class="btn">Create Game</button>';
 $('createBtn').addEventListener('click',createGame);
}
function goHome(){if(timer)clearInterval(timer);$('app').classList.add('hidden');$('app').innerHTML=''}
function showJoin(){
 $('app').classList.remove('hidden');
 $('app').innerHTML='<h2>👥 Join a Game</h2><input id="gameCode" class="input" maxlength="6" placeholder="Game code"><input id="playerName" class="input" placeholder="Your name"><button id="joinGameBtn" type="button" class="btn">Join Game</button>';
 $('joinGameBtn').addEventListener('click',joinGame);
}
async function createGame(){
 if(!init())return;
 isHost=true;
 let name=$('hostName').value.trim()||'Host',c=code();
 let {data:r,error}=await db.from('game_rooms').insert({code:c,host_name:name}).select().single();
 if(error)return alert(error.message);
 room=r;
 let qs=WORDS.map((x,i)=>({room_id:r.id,position:i,word:x[0],hint:x[1],points:1}));
 let {error:e}=await db.from('questions').insert(qs);
 if(e)return alert(e.message);
 await load();subscribe();renderHostLobby()
}
async function joinGame(){
 if(!init())return;
 let c=$('gameCode').value.trim().toUpperCase(),name=$('playerName').value.trim();
 if(!c||!name)return alert('Enter the game code and your name.');
 let {data:r,error}=await db.from('game_rooms').select('*').eq('code',c).single();
 if(error)return alert('Game not found.');
 if(r.status!=='lobby')return alert('This game has already started.');
 let {count}=await db.from('players').select('*',{count:'exact',head:true}).eq('room_id',r.id);
 if((count||0)>=15)return alert('This game is full (15 players maximum).');
 let {data:p,error:e}=await db.from('players').insert({room_id:r.id,name}).select().single();
 if(e)return alert(e.message);
 room=r;me=p;await load();subscribe();renderPlayerWaiting()
}
async function load(){let q=await db.from('questions').select('*').eq('room_id',room.id).order('position');questions=q.data||[]}
function subscribe(){
 channel=db.channel('room-'+room.id)
 .on('postgres_changes',{event:'*',schema:'public',table:'game_rooms',filter:'id=eq.'+room.id},async payload=>{room=payload.new;await load();if(room.status==='playing'){isHost?renderHostRound():renderPlayerRound()}else if(room.status==='finished'){renderFinal()}})
 .on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'room_id=eq.'+room.id},async()=>{if(isHost)renderHostPlayers();else if(me){let {data:p}=await db.from('players').select('*').eq('id',me.id).single();if(p){me=p;let s=$('score');if(s)s.textContent=me.score}}})
 .on('postgres_changes',{event:'*',schema:'public',table:'answers',filter:'room_id=eq.'+room.id},async payload=>{if(isHost){await renderSubmissions();if(payload.new?.correct)showHostWinner(payload.new)}else if(payload.new?.correct)showPlayerWinner(payload.new)})
 .subscribe()
}
async function startGame(){if(!questions.length)return alert('No questions are available.');await db.from('game_rooms').update({status:'playing',current_question:0}).eq('id',room.id)}
async function advanceAutomatically(){if(pausedBeforeNext)return;if(advanceInProgress)return;advanceInProgress=true;if(timer)clearInterval(timer);setTimeout(async()=>{if(room.current_question+1>=questions.length){await endGame()}else{await db.from('game_rooms').update({current_question:room.current_question+1}).eq('id',room.id)}advanceInProgress=false},1400)}
async function nextQuestion(){if(!isHost||advanceInProgress)return;if(timer)clearInterval(timer);if(room.current_question+1>=questions.length){await endGame()}else{await db.from('game_rooms').update({current_question:room.current_question+1}).eq('id',room.id)}}
function togglePause(){pausedBeforeNext=!!$('pauseNext')?.checked;let note=$('pauseNote');if(note)note.textContent=pausedBeforeNext?'⏸️ Paused: click Next Question when ready.':'▶️ Auto: next question loads after a correct answer.'}
async function endGame(){if(timer)clearInterval(timer);await db.from('game_rooms').update({status:'finished'}).eq('id',room.id)}
async function renderHostLobby(){$('app').innerHTML='<h2>🎮 Game Lobby</h2><p>Share this code with everyone:</p><div class="code">'+room.code+'</div><p class="muted">Players can join from the same website using this code.</p><div id="players"></div><button id="startBtn" type="button" class="btn">Start Game</button>' ;$('startBtn').addEventListener('click',startGame);renderHostPlayers()}
async function renderHostPlayers(){let {data:p}=await db.from('players').select('*').eq('room_id',room.id).order('score',{ascending:false});let el=$('players');if(el)el.innerHTML='<h3>Players ('+(p?.length||0)+'/15)</h3><ol class="board">'+(p||[]).map(x=>'<li>'+esc(x.name)+' — '+x.score+' point'+(x.score===1?'':'s')+'</li>').join('')+'</ol>'}
function startTimer(qid){if(timer)clearInterval(timer);let seconds=60;let el=$('timer');if(!el)return;el.textContent=seconds;timer=setInterval(()=>{seconds--;if(el)el.textContent=Math.max(seconds,0);if(seconds<=0){clearInterval(timer);timer=null;if(isHost)timeoutRound(qid);else{let q=questions.find(x=>x.id===qid);let f=$('feedback');if(f)f.innerHTML='<p class="bad">⏰ Time\'s up!</p><p>Correct answer: <b>'+esc(q?.word||'')+'</b></p>'}}},1000)}
async function timeoutRound(qid){let {data:a}=await db.from('answers').select('id').eq('question_id',qid).eq('correct',true).limit(1);if(a?.length)return;let box=$('winner');if(box)box.innerHTML='⏰ Time\'s up! <span class="small">The next question is loading…</span>';setTimeout(async()=>{if(room.current_question+1>=questions.length)await endGame();else await db.from('game_rooms').update({current_question:room.current_question+1}).eq('id',room.id)},1000)}
async function renderSubmissions(){let el=$('submissions');if(!el)return;let {data:a,error}=await db.from('answers').select('player_id,answer,correct,players(name)').eq('question_id',localQuestionId);if(error){el.innerHTML='<p class="muted">Unable to load submissions.</p>';return}let rows=a||[];el.innerHTML='<h3>📝 Answers Submitted ('+rows.length+')</h3>'+(rows.length?'<ol class="board">'+rows.map(x=>'<li><b>'+esc(x.players?.name||'Player')+'</b> — '+esc(x.answer)+' '+(x.correct?'✅':'❌')+'</li>').join('')+'</ol>':'<p class="muted">No answers submitted yet.</p>')}
function renderHostRound(){let q=questions[room.current_question];if(!q)return;localQuestionId=q.id;$('app').innerHTML='<h2>🎤 Host — Round '+(room.current_question+1)+'</h2><div class="scramble">'+shuffle(q.word)+'</div><div class="hint">💡 '+esc(q.hint)+'</div><div class="timer">⏱️ <span id="timer">60</span></div><div class="host-note"><label><input id="pauseNext" type="checkbox"> <b>Pause before next question</b></label><div id="pauseNote" class="small">▶️ Auto: next question loads after a correct answer.</div></div><div id="winner" class="host-note">🔒 Answer hidden — be ready to see who gets it first!</div><div class="row"><button id="nextBtn" type="button" class="btn alt">➡️ Next Question</button></div><p class="muted">Question '+(room.current_question+1)+' of '+questions.length+'</p><div id="players"></div>';$('pauseNext').checked=pausedBeforeNext;$('pauseNext').addEventListener('change',togglePause);$('nextBtn').addEventListener('click',nextQuestion);renderHostPlayers();renderSubmissions();startTimer(q.id)}
function showAnswerReveal(playerName,word){let old=$('answerReveal');if(old)old.remove();let div=document.createElement('div');div.id='answerReveal';div.className='answer-reveal';div.innerHTML='<div class="answer-card"><div class="trophy">🏆</div><div class="correct-label">CORRECT ANSWER!</div><div class="correct-word">'+esc(word)+'</div><div class="winner-name">🎉 '+esc(playerName)+' got it first!</div></div>';document.body.appendChild(div);setTimeout(()=>div.remove(),10000)}
async function showPlayerWinner(answer){if(answer.question_id!==localQuestionId)return;let {data:p}=await db.from('players').select('name').eq('id',answer.player_id).single();let q=questions[room.current_question];let f=$('feedback');if(f)f.innerHTML='🏆 <b>'+esc(p?.name||'A player')+' got it first!</b><br><span>Correct answer: <b>'+esc(q.word)+'</b> 🎉</span><br><span class="muted small">Next question loading…</span>'}
async function showHostWinner(answer){if(answer.question_id!==localQuestionId)return;let {data:p}=await db.from('players').select('name,score').eq('id',answer.player_id).single();let q=questions[room.current_question];let box=$('winner');if(box)box.innerHTML='🏆 <b>'+esc(p?.name||'A player')+' got it first!</b><br><span>Answer: '+esc(q.word)+' • +1 point</span><br><span class="small">'+(pausedBeforeNext?'Paused — click Next Question when ready.':'Next question loading…')+'</span>';await advanceAutomatically()}
function renderPlayerWaiting(){$('app').innerHTML='<div class="waiting"><h2>⏳ Waiting for the host</h2><p>Your name: <b>'+esc(me.name)+'</b></p><p>Game code: <span class="pill">'+room.code+'</span></p><p class="muted">The round will appear here when the host starts.</p><p>Your score: <span id="score" class="score">'+me.score+'</span></p></div>'}
async function renderPlayerRound(){let q=questions[room.current_question];if(!q)return;localQuestionId=q.id;$('app').innerHTML='<h2>🧩 Round '+(room.current_question+1)+'</h2><div class="scramble">'+shuffle(q.word)+'</div><div class="hint">💡 '+esc(q.hint)+'</div><div class="timer">⏱️ <span id="timer">60</span></div><input id="answer" class="input" placeholder="Type your answer"><button id="submitBtn" type="button" class="btn">Submit Answer</button><div id="feedback"><p class="muted">You can submit as many answers as you want until the 60-second timer ends.</p></div><p>Your score: <span id="score" class="score">'+me.score+'</span></p>';$('submitBtn').addEventListener('click',()=>submitAnswer(q.id,q.word));startTimer(q.id)}
async function submitAnswer(qid,correct){let input=$('answer'),btn=$('submitBtn');if(!input||!btn||input.disabled)return;let val=normalizeAnswer(input.value);if(!val)return;btn.disabled=true;let isCorrect=val===normalizeAnswer(correct);let {error}=await db.from('answers').insert({room_id:room.id,player_id:me.id,question_id:qid,answer:val,correct:isCorrect});btn.disabled=false;if(error)return alert(error.message);if(isCorrect){let {data:winner}=await db.from('answers').select('id').eq('question_id',qid).eq('correct',true).limit(1);if(winner?.length>1)return;let {data:p}=await db.from('players').select('score').eq('id',me.id).single();let {error:scoreError}=await db.from('players').update({score:(p.score||0)+1}).eq('id',me.id);if(scoreError)return alert(scoreError.message);me.score=(p.score||0)+1;input.disabled=true;btn.disabled=true;let f=$('feedback');if(f)f.innerHTML='<p class="ok">🎉 YOU GOT IT FIRST! +1 POINT</p><p class="muted">Next question loading…</p>';await advanceAutomatically()}else{input.value='';let f=$('feedback');if(f)f.innerHTML='<p class="bad">❌ Not quite — try another answer! You still have time. </p>'}}
async function renderFinal(){if(timer)clearInterval(timer);let {data:p}=await db.from('players').select('*').eq('room_id',room.id).order('score',{ascending:false});$('app').innerHTML='<h2>🏆 Final Leaderboard</h2><ol class="board">'+(p||[]).map(x=>'<li><b>'+esc(x.name)+'</b> — '+x.score+' point'+(x.score===1?'':'s')+'</li>').join('')+'</ol><button id="againBtn" type="button" class="btn">Play Again</button>';$('againBtn').addEventListener('click',()=>location.reload())}

document.addEventListener('DOMContentLoaded',()=>{
 $('hostBtn').addEventListener('click',showHost);
 $('joinBtn').addEventListener('click',showJoin);
});
</script>
</body>
</html>
